name: AI Daily

# 매일 아침 수집·선별해서 Neon에 넣는다.
# 무거운 일을 전부 여기서 하는 이유는 Vercel Hobby의 함수 실행 시간으로는
# 수십 번의 LLM 호출을 한 요청 안에 끝낼 수 없기 때문이다.
# Vercel 쪽은 그 결과를 읽어 보여주기만 한다.

on:
  schedule:
    # UTC 21:30 = KST 06:30. Actions 크론은 정시성이 약해서 실제로는
    # 10~30분 늦게 도는 일이 흔하다. 아침에 읽을 것이라 그 정도는 무해하다.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB에 쓰지 않고 결과만 로그로 확인"
        type: boolean
        default: false

# 앞 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다.
# 같은 후보를 두 번 채점하면 요청만 두 배로 쓴다.
concurrency:
  group: ai-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 수집·선별·저장
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 아래 넷은 없으면 코드의 기본값을 쓴다. 조정하고 싶을 때만 Secrets에 넣는다.
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_SIZE: ${{ vars.DIGEST_SIZE }}
          # GitHub Search 레이트리밋을 분당 10에서 30으로 올린다
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run pipeline:daily -- --dry
          else
            npm run pipeline:daily
          fi
